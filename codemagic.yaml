workflows:
  ios-workflow:
    name: "Pervin Muellim iOS"
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.pervinmuellim.app
      vars:
        XCODE_PROJECT: "PervinMuellim.xcodeproj"
        XCODE_SCHEME: "PervinMuellim"
    scripts:
      - name: "Find Info.plist and increment build number"
        script: |
          INFO_PLIST=$(find . -name "Info.plist" -not -path "*/build/*" -not -path "*/.git/*" | head -1)
          echo "Found Info.plist at: $INFO_PLIST"
          BUILD_NUMBER=$(($(date +%s)))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
      - name: "Fix iPad support"
        script: |
          INFO_PLIST=$(find . -name "Info.plist" -not -path "*/build/*" -not -path "*/.git/*" | head -1)
          /usr/libexec/PlistBuddy -c "Set :UIDeviceFamily:0 1" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$INFO_PLIST" 2>/dev/null || true
      - name: "Build iOS"
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/PervinMuellim.xcarchive \
            archive
      - name: "Export IPA"
        script: |
          xcodebuild -exportArchive \
            -archivePath build/PervinMuellim.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
