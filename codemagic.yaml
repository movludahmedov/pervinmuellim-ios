workflows:
  ios-workflow:
    name: "Pervin Muellim iOS"
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.pervinmuellim.app
      vars:
        XCODE_PROJECT: "PervinMuellim.xcodeproj"
        XCODE_SCHEME: "PervinMuellim"
    scripts:
      - name: "Set build number"
        script: |
          BUILD_NUMBER=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$CM_BUILD_DIR/PervinMuellim/PervinMuellim/Info.plist"
      - name: "Generate icons"
        script: |
          ICON_DIR="$CM_BUILD_DIR/PervinMuellim/Assets.xcassets/AppIcon.appiconset"
          SOURCE="$ICON_DIR/1024.png"
          sips -z 20 20   "$SOURCE" --out "$ICON_DIR/20.png"
          sips -z 29 29   "$SOURCE" --out "$ICON_DIR/29.png"
          sips -z 40 40   "$SOURCE" --out "$ICON_DIR/40.png"
          sips -z 58 58   "$SOURCE" --out "$ICON_DIR/58.png"
          sips -z 60 60   "$SOURCE" --out "$ICON_DIR/60.png"
          sips -z 76 76   "$SOURCE" --out "$ICON_DIR/76.png"
          sips -z 80 80   "$SOURCE" --out "$ICON_DIR/80.png"
          sips -z 87 87   "$SOURCE" --out "$ICON_DIR/87.png"
          sips -z 120 120 "$SOURCE" --out "$ICON_DIR/120.png"
          sips -z 152 152 "$SOURCE" --out "$ICON_DIR/152.png"
          sips -z 167 167 "$SOURCE" --out "$ICON_DIR/167.png"
          sips -z 180 180 "$SOURCE" --out "$ICON_DIR/180.png"
      - name: "Build iOS"
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/PervinMuellim.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            archive
      - name: "Export IPA"
        script: |
          cat > /tmp/exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/PervinMuellim.xcarchive" \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/"
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
