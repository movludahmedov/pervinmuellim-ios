workflows:
  ios-workflow:
    name: "Pervin Muellim iOS"
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: "26.4"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.pervinmuellim.app
      vars:
        XCODE_PROJECT: "PervinMuellim.xcodeproj"
        XCODE_SCHEME: "PervinMuellim"
    scripts:
      - name: "Set build number"
        script: |
          BUILD_NUMBER=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "PervinMuellim/PervinMuellim/Info.plist"
      - name: "Copy source files"
        script: |
          cp PervinMuellim/PervinMuellim/AppDelegate.swift PervinMuellim/AppDelegate.swift
          cp PervinMuellim/PervinMuellim/ViewController.swift PervinMuellim/ViewController.swift
          cp PervinMuellim/PervinMuellim/SceneDelegate.swift PervinMuellim/SceneDelegate.swift
          cp PervinMuellim/PervinMuellim/Info.plist PervinMuellim/Info.plist
      - name: "Generate iPad icons"
        script: |
          ICON_DIR="PervinMuellim/Assets.xcassets/AppIcon.appiconset"
          SOURCE="$ICON_DIR/1024.png"
          sips -z 20 20 "$SOURCE" --out "$ICON_DIR/20.png"
          sips -z 29 29 "$SOURCE" --out "$ICON_DIR/29.png"
          sips -z 76 76 "$SOURCE" --out "$ICON_DIR/76.png"
          sips -z 152 152 "$SOURCE" --out "$ICON_DIR/152.png"
          sips -z 167 167 "$SOURCE" --out "$ICON_DIR/167.png"
      - name: "Build iOS"
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/PervinMuellim.xcarchive \
            archive
      - name: "Export IPA"
        script: |
          xcodebuild -exportArchive \
            -archivePath build/PervinMuellim.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
