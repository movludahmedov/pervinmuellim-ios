workflows:
  ios-workflow:
    name: "Pervin Muellim iOS"
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: az.pervinmuellim.app
      vars:
        XCODE_PROJECT: "PervinMuellim.xcodeproj"
        XCODE_SCHEME: "PervinMuellim"
    scripts:
      - name: "Increment build number"
        script: |
          BUILD_NUMBER=$(date +%s)
          echo "Setting build number to: $BUILD_NUMBER"
          PBXPROJ="$XCODE_PROJECT/project.pbxproj"
          sed -i "" "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" "$PBXPROJ"
          sed -i "" "s/CFBundleVersion = [0-9]*/CFBundleVersion = $BUILD_NUMBER/g" "$PBXPROJ"
          echo "Done. Verifying:"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ"
          grep "CFBundleVersion" "$PBXPROJ"
      - name: "Fix iPad support"
        script: |
          INFO_PLIST=$(find . -name "Info.plist" -not -path "*/build/*" -not -path "*/.git/*" | head -1)
          echo "Found: $INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIDeviceFamily:0 1" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$INFO_PLIST" 2>/dev/null || true
      - name: "Build iOS"
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/PervinMuellim.xcarchive \
            archive
      - name: "Export IPA"
        script: |
          xcodebuild -exportArchive \
            -archivePath build/PervinMuellim.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
